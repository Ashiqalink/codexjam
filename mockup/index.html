  .top { top: 0; } .bottom { bottom: 0; }

  .skip {
    position: fixed; right: 2.5vw; top: 3.6vh; z-index: 3;
    font-family: "Arial Black", sans-serif; font-size: 1.6vh; color: #777; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="skip">ANY KEY TO SKIP</div>
